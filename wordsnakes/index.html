<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#152a3a">
<meta name="description" content="Word Snakes: a winding word puzzle built from the books Magnus and Felix read.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Snakes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Word Snakes</title>
<style>
  :root{
    --ink:#12203c;
    --board:#f3f7fd;
    --tile:#ffffff;
    --gold:#f2b705;
    --accent:#4aa3df;
    --bonus:#59c27a;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"Trebuchet MS", Verdana, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 12% 6%, #2d5f8a 0%, transparent 46%),
      radial-gradient(circle at 88% 10%, #7a4b9e 0%, transparent 42%),
      linear-gradient(180deg, #152a3a 0%, #1e3c56 55%, #2a5f6e 100%);
    background-attachment:fixed;
    user-select:none; -webkit-user-select:none;
    overflow-x:hidden;
  }
  .app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
       padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));}

  header{display:flex; align-items:center; gap:8px; min-height:42px;}
  .iconbtn{border:none; background:rgba(255,255,255,.15); color:#fff; width:42px; height:42px;
           border-radius:13px; font-size:18px; cursor:pointer; display:none; align-items:center; justify-content:center;}
  .iconbtn.show{display:flex;}
  .htitle{flex:1; min-width:0; text-align:center; font-size:16px; font-weight:bold;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .screen{display:none; flex:1; flex-direction:column;}
  .screen.on{display:flex;}

  /* ---------------- menu ---------------- */
  .hero{text-align:center; padding:10px 0 14px;}
  .hero h1{margin:0; font-size:clamp(30px,10vw,44px); letter-spacing:1px; text-shadow:0 3px 0 rgba(0,0,0,.25);}
  .hero p{margin:6px 0 0; font-size:14px; opacity:.85;}
  .plist{display:flex; flex-direction:column; gap:10px;}
  .pcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:none;
         border-radius:var(--r); padding:14px; background:#fff; color:var(--ink);
         box-shadow:0 5px 0 rgba(0,0,0,.22); font-family:inherit; cursor:pointer;}
  .pcard:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22);}
  .pcard .num{width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff;
              display:flex; align-items:center; justify-content:center; font-weight:bold; flex:none;}
  .pcard b{display:block; font-size:17px;}
  .pcard span{font-size:12.5px; opacity:.7;}
  .pcard .state{margin-left:auto; font-size:20px; flex:none; text-align:center;}
  .pcard .state .part{display:block; font-size:11px; font-style:normal; font-weight:bold;
                      opacity:.6; line-height:1.2;}
  .note{margin-top:14px; font-size:12.5px; opacity:.8; text-align:center; line-height:1.6;}

  /* ---------------- play ---------------- */
  .clue{background:rgba(255,255,255,.14); border-radius:var(--r); padding:10px 12px; text-align:center;
        margin-bottom:8px;}
  .clue b{display:block; font-size:17px;}
  .clue span{font-size:12.5px; opacity:.8;}

  .boardwrap{display:flex; justify-content:center;}
  .board{
    --gap:5px;
    --cell:min( calc((100vw - 40px - 5*var(--gap)) / 6),
                calc((100vh - 280px - 7*var(--gap)) / 8), 62px );
    position:relative;
    display:grid;
    grid-template-columns:repeat(6, var(--cell));
    grid-auto-rows:var(--cell);
    gap:var(--gap);
    padding:6px;
    border-radius:20px;
    background:var(--board);
    touch-action:none;
  }
  #lines{position:absolute; inset:6px; z-index:0; pointer-events:none; overflow:visible;}
  .cell{
    position:relative; z-index:1; border:none; padding:0; margin:0;
    width:var(--cell); height:var(--cell); border-radius:50%;
    background:var(--tile); color:var(--ink); font-family:inherit; font-weight:bold;
    font-size:calc(var(--cell) * 0.44); cursor:pointer; touch-action:none;
  }
  .cell.on{background:transparent; color:#fff;}
  .cell.pick{background:transparent; color:#fff;}
  .cell.hint{box-shadow:inset 0 0 0 3px var(--accent);}
  .board.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}

  .status{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .found{font-size:14px; font-weight:bold;}
  .found small{display:block; font-weight:normal; opacity:.75; font-size:11.5px;}
  .dots{display:flex; gap:5px; margin-left:auto;}
  .dot{width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.25);}
  .dot.lit{background:var(--bonus);}
  .hintbtn{border:none; border-radius:14px; padding:11px 14px; font-family:inherit; font-weight:bold;
           font-size:15px; color:#fff; background:var(--accent); box-shadow:0 4px 0 #2b7fb8; cursor:pointer;}
  .hintbtn[disabled]{background:rgba(255,255,255,.18); box-shadow:0 4px 0 rgba(0,0,0,.2); opacity:.6;}
  .hintbtn:active:not([disabled]){transform:translateY(2px); box-shadow:0 2px 0 #2b7fb8;}

  .toast{
    position:fixed; left:50%; bottom:calc(10px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:rgba(0,0,0,.78); color:#fff; padding:10px 16px; border-radius:14px;
    font-size:15px; font-weight:bold; opacity:0; pointer-events:none; transition:opacity .25s; z-index:40;
    max-width:90vw; text-align:center;
  }
  .toast.on{opacity:1;}

  .wordlist{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
  .chip{background:rgba(255,255,255,.16); border-radius:11px; padding:4px 9px; font-size:12px; font-weight:bold;}
  .chip.span{background:var(--gold); color:#3b2c00;}

  /* ---------------- win ---------------- */
  .win{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
       background:rgba(8,18,28,.75); z-index:60;}
  .win.on{display:flex;}
  .wincard{background:#fff; color:var(--ink); border-radius:24px; padding:24px 20px; text-align:center;
           max-width:340px; width:100%; animation:pop .4s;}
  @keyframes pop{0%{transform:scale(.8)} 60%{transform:scale(1.08)} 100%{transform:scale(1)}}
  .wincard .em{font-size:52px;}
  .wincard h2{margin:6px 0 4px; font-size:23px;}
  .wincard p{margin:0 0 16px; font-size:14.5px; opacity:.75;}
  .wbtns{display:flex; gap:10px;}
  .wbtns button{flex:1; border:none; border-radius:15px; padding:14px 8px; font-family:inherit;
                font-weight:bold; font-size:16px; color:#fff; background:var(--accent);
                box-shadow:0 4px 0 #2b7fb8; cursor:pointer;}
  .wbtns button.ghost{background:#eef3fb; color:var(--ink); box-shadow:0 4px 0 #c9d4e6;}

  #cheer{position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden;}
  #cheer span{position:absolute; font-size:26px; animation:fall linear forwards;}
  @keyframes fall{from{transform:translateY(-40px) rotate(0)} to{transform:translateY(105vh) rotate(400deg)}}
</style>
</head>
<body>
<div id="cheer"></div>
<div class="toast" id="toast"></div>

<div class="app">
  <header>
    <button class="iconbtn" id="back" aria-label="Back">&#8592;</button>
    <div class="htitle" id="htitle">Word Snakes</div>
    <button class="iconbtn show" id="mute" aria-label="Sound">&#128266;</button>
  </header>

  <section class="screen on" id="s-menu">
    <div class="hero">
      <h1>Word Snakes</h1>
      <p>Wind through the letters to find the hidden words</p>
    </div>
    <div class="plist" id="plist"></div>
    <p class="note">
      Every letter belongs to one answer &mdash; there is nothing left over.<br>
      One answer is the <b>spangram</b>: it names the theme and stretches
      right across the board.
    </p>
  </section>

  <section class="screen" id="s-play">
    <div class="clue"><b id="c-theme"></b><span id="c-clue"></span></div>
    <div class="boardwrap">
      <div class="board" id="board"><svg id="lines"></svg></div>
    </div>
    <div class="status">
      <div class="found"><span id="f-count"></span><small id="f-span"></small></div>
      <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
      <button class="hintbtn" id="hint" disabled>Hint</button>
    </div>
    <div class="wordlist" id="wordlist"></div>
  </section>
</div>

<div class="win" id="win">
  <div class="wincard">
    <div class="em" id="w-em">&#127881;</div>
    <h2 id="w-title"></h2>
    <p id="w-text"></p>
    <div class="wbtns">
      <button class="ghost" id="w-menu">Puzzles</button>
      <button id="w-next">Next one</button>
    </div>
  </div>
</div>

var ROWS = 8, COLS = 6, N = ROWS * COLS;
var WORD_COLOURS = ["#e2557a","#7b61ff","#2f9ec4","#5bc236","#ff8a3d","#c14ecf","#1f9e8f","#e0483c"];

var $ = function(id){ return document.getElementById(id); };

/* ---------- saved progress ---------- */
var store = {
  read: function(){
    try{ return JSON.parse(localStorage.getItem("wordsnakes") || "{}"); }
    catch(e){ return {}; }
  },
  write: function(o){ try{ localStorage.setItem("wordsnakes", JSON.stringify(o)); }catch(e){} }
};
var state = store.read();
if(!state.done){ state.done = {}; }
if(!state.inprog){ state.inprog = {}; }   /* boards left half finished */
if(typeof state.sound !== "boolean"){ state.sound = true; }

/* ---------- sound, made in the browser so nothing needs downloading ---------- */
var actx = null;
function beep(freq, len, type){
  if(!state.sound){ return; }
  try{
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(actx.state === "suspended"){ actx.resume(); }
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + len);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + len + 0.02);
  }catch(e){}
}
function sndTick(){ beep(440 + Math.random()*120, 0.05, "triangle"); }
function sndGood(){ beep(660, 0.12); setTimeout(function(){ beep(880, 0.15); }, 100); }
function sndSpan(){ [660,880,1100].forEach(function(f,i){ setTimeout(function(){ beep(f, 0.16); }, i*110); }); }
function sndBonus(){ beep(780, 0.09, "square"); }
function sndNo(){ beep(170, 0.16, "sawtooth"); }
function sndWin(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f, 0.18); }, i*130); }); }
function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

function cheer(){
  var box = $("cheer"), bits = ["🎉","⭐","🐍","📚","✨","🎊"];
  for(var i = 0; i < 22; i++){
    var s = document.createElement("span");
    s.textContent = bits[Math.floor(Math.random()*bits.length)];
    s.style.left = (Math.random()*96) + "%";
    s.style.animationDuration = (1.6 + Math.random()*1.3) + "s";
    s.style.animationDelay = (Math.random()*0.4) + "s";
    box.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 3400); })(s);
  }
}

function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove("on"); }, 1500);
}

/* A board you leave half done keeps what you had found: the answers, the
   ordinary words you had spotted and any hint owing. Only finished boards
   used to be saved, so walking away wiped the lot. */
function saveProgress(){
  if(!P || state.done[P.id]){ return; }
  var found = Object.keys(solved), extras = Object.keys(bonusWords);
  if(!found.length && !extras.length && !bonusCount && !hintsReady){
    delete state.inprog[P.id];
  } else {
    state.inprog[P.id] = { solved:found, bonus:extras, count:bonusCount, hints:hintsReady };
  }
  store.write(state);
}

function loadProgress(){
  var saved = state.inprog[P.id];
  if(!saved || state.done[P.id]){ return; }
  (saved.solved || []).forEach(function(word){
    P.answers.forEach(function(a){
      if(a.word !== word){ return; }
      solved[word] = true;
      a.path.forEach(function(c){ cellOwner[c] = word; });
    });
  });
  (saved.bonus || []).forEach(function(word){ bonusWords[word] = true; });
  bonusCount = saved.count || 0;
  hintsReady = saved.hints || 0;
}

function paintMenu(){
  var list = $("plist");
  list.innerHTML = "";
  PUZZLES.forEach(function(p, i){
    var b = document.createElement("button");
    b.className = "pcard";
    var part = state.inprog[p.id];
    var mark = state.done[p.id] ? "✅"
             : (part && part.solved && part.solved.length
                 ? "<i class='part'>" + part.solved.length + " of " + p.answers.length + "<br>found</i>"
                 : "");
    b.innerHTML = "<span class='num'>" + (i+1) + "</span>" +
                  "<span><b>" + p.theme + "</b><span>" + p.clue + "</span></span>" +

  $("s-play").classList.toggle("on", name === "play");
  $("back").classList.toggle("show", name === "play");
  $("htitle").textContent = name === "play" ? "Word Snakes" : "";   /* the menu has a big title already */
  $("win").classList.remove("on");
  window.scrollTo(0, 0);

$("back").onclick = function(){ sndTick(); show("menu"); paintMenu(); };

/* ==========================================================================
   playing a board
   ========================================================================== */
var P = null;          /* the puzzle being played */
var cells = [];        /* the 48 buttons */
var solved = {};       /* word -> true */
var cellOwner = [];    /* cell -> word that has been solved there */
var sel = [];          /* cells currently picked out */
var dragging = false, moved = false;
var bonusWords = {}, bonusCount = 0, hintsReady = 0, hintWord = null;

function openPuzzle(i){
  P = PUZZLES[i];
  P.index = i;
  solved = {};
  cellOwner = new Array(N);
  sel = [];
  bonusWords = {}; bonusCount = 0; hintsReady = 0; hintWord = null;

  loadProgress();

  $("c-theme").textContent = P.theme;
  $("c-clue").textContent = P.clue;
  buildBoard();
  paintAll();
  show("play");
}

function buildBoard(){
  var board = $("board");
  /* keep the svg, replace the letters */
  Array.prototype.slice.call(board.querySelectorAll(".cell")).forEach(function(c){ c.remove(); });
  cells = [];
  for(var i = 0; i < N; i++){
    var b = document.createElement("button");
    b.className = "cell";
    b.textContent = P.grid[i];
    b.dataset.i = i;
    board.appendChild(b);
    cells.push(b);
  }
}

function rc(i){ return [Math.floor(i / COLS), i % COLS]; }
function adjacent(a, b){
  var x = rc(a), y = rc(b);
  var dr = Math.abs(x[0] - y[0]), dc = Math.abs(x[1] - y[1]);
  return (dr <= 1 && dc <= 1) && (dr + dc > 0);
}

/* ---------- drawing the snakes ---------- */
function centre(i){
  var c = cells[i], board = $("board");
  return [c.offsetLeft - 6 + c.offsetWidth / 2, c.offsetTop - 6 + c.offsetHeight / 2];
}
function snake(path, colour, width, fade){
  var NS = "http://www.w3.org/2000/svg";
  var g = document.createElementNS(NS, "g");
  if(fade){ g.setAttribute("opacity", fade); }
  /* Each step is its own rounded segment, with a blob on every letter. Drawing
     it as one long polyline left hairline seams where a snake doubled back on
     itself; overlapping opaque pieces cannot. Group opacity keeps the overlaps
     from showing through each other. */
  path.forEach(function(cell, k){
    var mid = centre(cell);
    if(k){
      var prev = centre(path[k - 1]);
      var seg = document.createElementNS(NS, "line");
      seg.setAttribute("x1", prev[0]); seg.setAttribute("y1", prev[1]);
      seg.setAttribute("x2", mid[0]);  seg.setAttribute("y2", mid[1]);
      seg.setAttribute("stroke", colour);
      seg.setAttribute("stroke-width", width);
      seg.setAttribute("stroke-linecap", "round");
      g.appendChild(seg);
    }
    var dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", mid[0]);
    dot.setAttribute("cy", mid[1]);
    dot.setAttribute("r", width / 2);
    dot.setAttribute("fill", colour);
    g.appendChild(dot);
  });
  return g;
}

function paintAll(){
  var svg = $("lines");
  var board = $("board");
  svg.setAttribute("width", board.clientWidth - 12);
  svg.setAttribute("height", board.clientHeight - 12);
  svg.innerHTML = "";

  var cellSize = cells[0] ? cells[0].offsetWidth : 40;
  var band = Math.max(14, cellSize * 0.78);

  /* answers already found */
  P.answers.forEach(function(a, n){
    if(!solved[a.word]){ return; }
    var colour = a.word === P.spangram ? "#f2b705" : WORD_COLOURS[n % WORD_COLOURS.length];
    svg.appendChild(snake(a.path, colour, band));
  });
  /* the letters being picked out right now */
  if(sel.length){
    svg.appendChild(snake(sel, "#4aa3df", band, "0.95"));
  }

  cells.forEach(function(c, i){
    c.className = "cell" +
      (cellOwner[i] ? " on" : "") +
      (sel.indexOf(i) > -1 ? " pick" : "") +
      (hintWord && hintWord.path.indexOf(i) > -1 && !solved[hintWord.word] ? " hint" : "");
  });

  var total = P.answers.length;
  var got = Object.keys(solved).length;
  $("f-count").textContent = got + " of " + total + " found";
  $("f-span").textContent = solved[P.spangram] ? "spangram found!" : "spangram still hiding";

  var dots = $("dots").children;
  var towards = hintsReady > 0 ? 3 : bonusCount % 3;   /* three ordinary words earn a hint */
  for(var d = 0; d < 3; d++){
    dots[d].className = "dot" + (d < towards ? " lit" : "");
  }
  $("hint").disabled = hintsReady < 1;
  $("hint").textContent = hintsReady > 0 ? "Hint ready!" : "Hint";

  var wl = $("wordlist");
  wl.innerHTML = "";
  P.answers.forEach(function(a){
    if(!solved[a.word]){ return; }
    var s = document.createElement("span");
    s.className = "chip" + (a.word === P.spangram ? " span" : "");
    s.textContent = a.word;
    wl.appendChild(s);
  });
}

/* ---------- picking letters out ---------- */
function cellAt(x, y){
  var el = document.elementFromPoint(x, y);
  if(!el || !el.classList || !el.classList.contains("cell")){ return -1; }
  return parseInt(el.dataset.i, 10);
}

function tryAdd(i){
  if(i < 0 || cellOwner[i]){ return; }
  var at = sel.indexOf(i);
  if(at > -1){
    /* stepping back the way you came */
    if(at === sel.length - 2){ sel.pop(); paintAll(); }
    return;
  }
  if(sel.length && !adjacent(sel[sel.length - 1], i)){ return; }
  sel.push(i);
  sndTick();
  paintAll();
}

function onDown(e){
  var i = cellAt(e.clientX, e.clientY);
  if(i < 0){ return; }
  e.preventDefault();
  if(sel.length && i === sel[sel.length - 1]){ submit(); return; }   /* tap the last letter to send */
  if(sel.length && adjacent(sel[sel.length - 1], i) && sel.indexOf(i) < 0 && !cellOwner[i]){
    dragging = true; moved = false;
    tryAdd(i);
    return;
  }
  if(cellOwner[i]){ return; }
  sel = [i];
  dragging = true; moved = false;
  sndTick();
  paintAll();
}
function onMove(e){
  if(!dragging){ return; }
  e.preventDefault();
  var i = cellAt(e.clientX, e.clientY);
  if(i < 0 || i === sel[sel.length - 1]){ return; }
  moved = true;
  tryAdd(i);
}
function onUp(){
  if(dragging && moved && sel.length > 1){ submit(); }
  dragging = false;
}

$("board").addEventListener("pointerdown", onDown);
$("board").addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ---------- checking what was traced ---------- */
function submit(){
  if(sel.length < 2){ sel = []; paintAll(); return; }
  var word = sel.map(function(i){ return P.grid[i]; }).join("");
  var back = sel.slice().reverse().map(function(i){ return P.grid[i]; }).join("");

  var answer = null;
  P.answers.forEach(function(a){
    if(!solved[a.word] && (a.word === word || a.word === back)){ answer = a; }
  });
  if(answer){ lockIn(answer); return; }

  var bonus = (P.extras.indexOf(word) > -1 && word) || (P.extras.indexOf(back) > -1 && back);
  if(bonus){
    if(bonusWords[bonus]){
      toast("Already found " + bonus);
      sel = []; paintAll(); return;
    }
    bonusWords[bonus] = true;
    bonusCount++;
    sndBonus(); buzz(20);
    saveProgress();
    if(bonusCount % 3 === 0){
      hintsReady++;
      toast(bonus + "! That is a hint earned 💡");
    } else {
      toast(bonus + "! " + (3 - (bonusCount % 3)) + " more for a hint");
    }
    sel = []; paintAll();
    return;
  }

  sndNo(); buzz(60);
  $("board").classList.add("shake");
  setTimeout(function(){ $("board").classList.remove("shake"); }, 420);
  sel = [];
  paintAll();
}

function lockIn(answer){
  solved[answer.word] = true;
  answer.path.forEach(function(c){ cellOwner[c] = answer.word; });
  if(hintWord && hintWord.word === answer.word){ hintWord = null; }
  sel = [];
  if(answer.word === P.spangram){
    sndSpan(); buzz([30,50,30]);
    toast("The spangram! " + answer.word);
  } else {
    sndGood(); buzz(30);
  }
  paintAll();

  if(Object.keys(solved).length === P.answers.length){
    state.done[P.id] = true;
    delete state.inprog[P.id];
    store.write(state);
    setTimeout(finish, 550);
  } else {
    saveProgress();
  }
}

function finish(){
  var more = PUZZLES.some(function(p){ return !state.done[p.id]; });
  $("w-em").textContent = "🎉";
  $("w-title").textContent = "Board cleared!";
  $("w-text").textContent = "You found all " + P.answers.length + " answers in " + P.theme + ".";
  $("w-next").hidden = !more;
  $("win").classList.add("on");
  cheer(); sndWin();
}
$("w-menu").onclick = function(){ sndTick(); show("menu"); paintMenu(); };
$("w-next").onclick = function(){
  sndTick();
  $("win").classList.remove("on");
  for(var k = 1; k <= PUZZLES.length; k++){
    var n = (P.index + k) % PUZZLES.length;
    if(!state.done[PUZZLES[n].id]){ openPuzzle(n); return; }
  }
  show("menu"); paintMenu();
};

/* ---------- hints ---------- */
$("hint").onclick = function(){
  if(hintsReady < 1){ return; }
  var left = P.answers.filter(function(a){ return !solved[a.word]; });
  if(!left.length){ return; }
  /* a word that is not already being pointed at */
  var fresh = left.filter(function(a){ return !hintWord || a.word !== hintWord.word; });
  hintWord = (fresh.length ? fresh : left)[Math.floor(Math.random() * (fresh.length ? fresh.length : left.length))];
  hintsReady--;
  saveProgress();
  sndGood();
  toast("These letters make one answer");
  paintAll();
};

/* ---------- sound toggle ---------- */
function paintMute(){ $("mute").innerHTML = state.sound ? "🔊" : "🔇"; }
$("mute").onclick = function(){
  state.sound = !state.sound;
  store.write(state);
  paintMute();
  if(state.sound){ sndTick(); }
};

window.addEventListener("resize", function(){ if(P){ paintAll(); } });

paintMenu();
paintMute();
show("menu");

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){});
  });
  navigator.serviceWorker.addEventListener("message", function(e){
    if(!e.data || e.data.type !== "new-version"){ return; }
    try{
      if(sessionStorage.getItem("ws-refreshed")){ return; }
      sessionStorage.setItem("ws-refreshed", "1");
    }catch(err){}
    location.reload();
  });
}
</script>
